<svg xmlns="http://www.w3.org/2000/svg" width="950" height="250"><rect width="950" height="250" fill="#f5f2ec"/><g fill="#484039" font-family="Microsoft YaHei,sans-serif"><text x="28" y="42" font-size="26">最终产出 · 内部设计说明节选</text><text x="28" y="90" font-size="23">一张整体拼接起来的长图，其内容包含采编提供的大事记。</text><text x="28" y="128" font-size="23">（长图与素材一共大小不超过10mb。）</text><text x="28" y="166" font-size="23">一张各种需要置于人物图层之上的素材组合成为的长图。</text><text x="28" y="204" font-size="23">（位置需要和长图上保持一致，尺寸与长图相同。）</text></g></svg>